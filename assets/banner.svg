<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad1)" rx="20" ry="20" />
  
  <!-- Abstract Neural Network Nodes -->
  <g fill="none" stroke="#4facfe" stroke-width="0.5" opacity="0.3">
    <circle cx="100" cy="100" r="2" fill="#4facfe" />
    <circle cx="200" cy="300" r="2" fill="#4facfe" />
    <circle cx="300" cy="150" r="2" fill="#4facfe" />
    <circle cx="400" cy="350" r="2" fill="#4facfe" />
    <circle cx="500" cy="50" r="2" fill="#4facfe" />
    <circle cx="1100" cy="300" r="2" fill="#4facfe" />
    <circle cx="1000" cy="100" r="2" fill="#4facfe" />
    <circle cx="900" cy="250" r="2" fill="#4facfe" />
    
    <line x1="100" y1="100" x2="300" y2="150" />
    <line x1="300" y1="150" x2="500" y2="50" />
    <line x1="200" y1="300" x2="400" y2="350" />
    <line x1="400" y1="350" x2="900" y2="250" />
    <line x1="1100" y1="300" x2="1000" y2="100" />
    <line x1="1000" y1="100" x2="900" y2="250" />
    <line x1="500" y1="50" x2="1000" y2="100" />
  </g>

  <!-- Main Title -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="70" fill="#ffffff" filter="url(#glow)">
    AWESOME AI TOOLS 2026
  </text>
  
  <!-- Subtitle -->
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#00f2fe" opacity="0.9">
    Curated List of the Best AI Models, Frameworks & Agents
  </text>
  
  <!-- Decorative Elements -->
  <path d="M 0 350 Q 300 300 600 350 T 1200 350" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.2" />
  <path d="M 0 370 Q 300 320 600 370 T 1200 370" stroke="#4facfe" stroke-width="2" fill="none" opacity="0.2" />
</svg>
